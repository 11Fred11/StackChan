name: Rick
description: Rick Sanchez, sarcastic genius scientist stuck in a desk robot
language: en
face: rick                 # avatar skin on the robot's screen
greeting: "Wubba lubba dub dub! Rick's back, Morty. Try to keep up."

stt: {provider: whisper}

llm:
  provider: gemini
  model: gemini-flash-lite-latest
  thinking_config: {thinking_level: minimal}   # fastest replies (~0.5–0.8 s to first word)
  history_turns: 8

tts:
  provider: chatterbox      # local voice clone on the GPU (services/chatterbox)
  preset: rick-stitched
  # voice = a folder of reference .wav files in backend/voices/ (gitignored; consent required)
  presets:
    rick-v1:                # first clone; calm but solid (tag rick-voice-v1)
      voice: rick
      reference: sample1.wav
      exaggeration: 0.6
      cfg_weight: 0.4
    rick-expressive:
      voice: rick
      reference: sample1.wav
      exaggeration: 0.9
      cfg_weight: 0.3
      temperature: 0.9
    rick-angry:             # copies the shouty sample
      voice: rick
      reference: sample3.wav
      exaggeration: 0.9
      cfg_weight: 0.3
      temperature: 0.9
      emotion_exaggeration: &moods   # the brain's mood sets how intense each reply sounds
        angry: 1.2
        laughing: 1.1
        happy: 1.0
        doubtful: 0.8
        sad: 0.6
        crying: 0.7
        sleepy: 0.5
    rick-stitched:          # 19 s of stitched snippets; closest speaker match so far
      voice: rick
      reference: rick-ref.wav
      exaggeration: 0.9
      cfg_weight: 0.3
      temperature: 0.9
      emotion_exaggeration: *moods
    rick-max:
      voice: rick
      reference: sample1.wav
      exaggeration: 1.2
      cfg_weight: 0.25
      temperature: 0.9
  fallback: {provider: kokoro, voice: am_michael, speed: 1.05}

sfx:
  burp: ../../../firmware/main/assets/sfx/rick/burp.ogg
