[project]
name = "rick-gateway"
version = "0.1.0"
description = "Self-hosted voice gateway for Stack-chan (Xiaozhi device protocol)"
readme = "README.md"
authors = [
    { name = "Fredj Hammami", email = "contact.hammami.fredj@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.4",
    "opuslib>=3.0.1",
    "pyyaml>=6.0.3",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "webrtcvad-wheels>=2.0.14.post1",
]

[project.scripts]
rick-gateway = "rick_gateway.server:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "websockets>=17.2",
]
