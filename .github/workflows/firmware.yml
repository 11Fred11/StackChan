name: Firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Host tests (motion math)
        run: |
          cmake -S tests -B build-host-tests
          cmake --build build-host-tests
          ctest --test-dir build-host-tests --output-on-failure

      - name: Fetch dependencies (forks pinned in repos.json)
        run: |
          git config --global --add safe.directory '*'
          python3 fetch_repos.py

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: stack-chan-firmware-${{ github.sha }}
          path: |
            firmware/build/stack-chan.bin
            firmware/build/generated_assets.bin
            firmware/build/ota_data_initial.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
